services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.0.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
      - "1025:1025"

  activation-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/activation-api/main.js"]
    ports:
      - "3000:3000"
    environment:
      - KAFKA_BROKERS=kafka:19092
      - MONGO_URI=mongodb://mongo:27017/activation
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/billing-service/main.js"]
    environment:
      - KAFKA_BROKERS=kafka:19092
      - MONGO_URI=mongodb://mongo:27017/billing
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy

  provisioning-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/provisioning-service/main.js"]
    environment:
      - KAFKA_BROKERS=kafka:19092
      - MONGO_URI=mongodb://mongo:27017/provisioning
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/notification-service/main.js"]
    environment:
      - KAFKA_BROKERS=kafka:19092
      - MONGO_URI=mongodb://mongo:27017/notification
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_started

  crm-analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/crm-analytics-service/main.js"]
    environment:
      - KAFKA_BROKERS=kafka:19092
      - MONGO_URI=mongodb://mongo:27017/crm
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy